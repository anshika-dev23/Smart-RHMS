<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Patient | SwasthyaSetu</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="form-container">

        <h1>🩺 Register Patient</h1>

        <p class="form-subtitle">
            Add a new patient to SwasthyaSetu
        </p>

        <form method="POST">

            <!-- Patient Name -->
            <label>Patient Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter patient name"
                required
            >


            <!-- Age -->
            <label>Age</label>
            <input
                type="number"
                name="age"
                placeholder="Enter age"
                min="1"
                max="120"
                required
            >


            <!-- Gender -->
            <label>Gender</label>
            <select name="gender" required>

                <option value="">
                    Select Gender
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Other">
                    Other
                </option>

                <option value="Prefer not to say">
                    Prefer not to say
                </option>

            </select>


            <!-- Village -->
            <label>Village</label>
            <input
                type="text"
                name="village"
                placeholder="Enter village name"
                required
            >


            <!-- Phone -->
            <label>Phone Number</label>
            <input
                type="tel"
                name="phone"
                placeholder="Enter 10-digit phone number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >


            <!-- Emergency Contact -->
            <label>Emergency Contact</label>
            <input
                type="tel"
                name="emergency_contact"
                placeholder="Enter emergency contact number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >


            <!-- Blood Group -->
            <label>Blood Group</label>

            <select name="blood_group" required>

                <option value="">
                    Select Blood Group
                </option>

                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>

                <option value="Unknown">
                    Unknown
                </option>

            </select>


            <!-- Submit -->
            <button type="submit">
                Register Patient →
            </button>

        </form>

    </div>

</body>

</html>
